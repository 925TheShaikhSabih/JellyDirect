name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just accept licences so Gradle can fetch platform 36.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      # Publishes the APKs as plain downloadable files on the repo's Releases page (no zip).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app/build/outputs/apk/*/release/*.apk \
            --title "JellyDirect build ${{ github.run_number }}" \
            --notes "Automated build of ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
